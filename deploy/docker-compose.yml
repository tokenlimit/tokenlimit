version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: tokenlimit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - tokenlimit-net

  mysql:
    image: mysql:8.0
    container_name: tokenlimit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: tokenlimit
      MYSQL_USER: ${MYSQL_USER:-tokenlimit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tokenlimit}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - tokenlimit-net

volumes:
  redis-data:
  mysql-data:

networks:
  tokenlimit-net:
    driver: bridge
